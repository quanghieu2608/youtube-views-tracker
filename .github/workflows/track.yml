name: YouTube Views Tracker

on:
  schedule:
    # Dự phòng cron nội bộ GitHub Actions
    - cron: "*/15 * * * *"
  # Cho phép cron-job.org gọi API kích hoạt chuẩn từng giây
  workflow_dispatch:

permissions:
  contents: write

# Khóa hàng đợi: chỉ cho phép 1 tiến trình chạy tại 1 thời điểm, chống đè commit
concurrency:
  group: tracker-sync
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client

      - name: Run Tracker Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python run.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet data.json; then
            cp data.json /tmp/data_new.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/data_new.json data.json
            git add data.json
            if ! git diff --staged --quiet; then
              git commit -m "Auto update views 15m [skip ci]"
              git push origin main
              echo "Push data.json thanh cong!"
            fi
          else
            echo "Khong co thay doi nao trong data.json."
          fi
