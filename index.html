<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Realtime Pro</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --hover-bg: #172033;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --blue: #38bdf8;
      --green: #22c55e;
      --orange: #f97316;
      --red: #ef4444;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Top Bar */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: #1f2937;
      border: 1px solid #374151;
      color: #e5e7eb;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #374151;
    }

    .btn-primary {
      background: #1e3a8a;
      border-color: #3b82f6;
      color: #93c5fd;
    }

    .btn-primary:hover {
      background: #2563eb;
      color: #fff;
    }

    /* Stats tracker line */
    .status-bar {
      display: flex;
      justify-content: space-between;
      color: var(--text-dim);
      font-size: 11px;
      margin-bottom: 8px;
    }

    .progress-bar-container {
      width: 100%;
      height: 3px;
      background: #1f2937;
      border-radius: 2px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .progress-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      animation: progressAnim 900s linear infinite;
    }

    @keyframes progressAnim {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    /* Filters Bar */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-group {
      display: flex;
      gap: 4px;
    }

    .filter-btn {
      background: #111827;
      border: 1px solid #1f2937;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
    }

    .filter-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #3b82f6;
    }

    /* Channel Cards */
    .channels-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .channel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .channel-card:hover {
      border-color: #374151;
    }

    .channel-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.01);
      user-select: none;
    }

    .ch-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ch-arrow {
      color: var(--text-dim);
      font-size: 11px;
      transition: transform 0.2s;
    }

    .channel-card.open .ch-arrow {
      transform: rotate(90deg);
    }

    .ch-name {
      font-weight: 600;
      font-size: 14px;
      color: #f9fafb;
    }

    .badges {
      display: flex;
      gap: 6px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .badge-viral {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .badge-revived {
      background: rgba(249, 115, 22, 0.15);
      color: #fb923c;
      border: 1px solid rgba(249, 115, 22, 0.3);
    }

    .ch-detail-btn {
      color: var(--blue);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Channel Sub Bar */
    .ch-stats-overview {
      padding: 0 16px 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-dim);
      font-size: 11px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Metric Grid */
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1.5fr;
      padding: 12px 16px;
      gap: 12px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .metric-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .metric-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text-dim);
    }

    .metric-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--blue);
    }

    .metric-val.green {
      color: var(--green);
    }

    .metric-val.orange {
      color: var(--orange);
    }

    /* 15m Bars Container */
    .slice-bars-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .slice-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 24px;
    }

    .bar {
      width: 14px;
      background: #1f2937;
      border-radius: 2px 2px 0 0;
      min-height: 2px;
      transition: height 0.3s;
    }

    .bar.has-view {
      background: var(--blue);
    }

    .bar.latest {
      background: var(--green);
    }

    .slice-labels {
      display: flex;
      gap: 4px;
      font-size: 9px;
      color: var(--text-dim);
    }

    /* Long-term stats row */
    .long-term-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.2);
      font-size: 11px;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
    }

    .lt-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .lt-val {
      font-weight: 600;
      color: #e5e7eb;
    }

    /* Expanded Drawer */
    .drawer-content {
      display: none;
      background: #0d131f;
      border-top: 1px solid var(--card-border);
      padding: 16px;
    }

    .channel-card.open .drawer-content {
      display: block;
    }

    .drawer-tabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 8px;
      margin-bottom: 12px;
      overflow-x: auto;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: #1f2937;
      color: #fff;
      border-color: #374151;
    }

    .tab-btn.tab-revived {
      color: var(--orange);
    }

    .tab-btn.tab-revived.active {
      background: rgba(249, 115, 22, 0.15);
      border-color: var(--orange);
    }

    /* Video Row */
    .video-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      gap: 12px;
    }

    .video-item:last-child {
      border-bottom: none;
    }

    .video-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .vid-rank {
      color: var(--text-dim);
      font-size: 11px;
      width: 24px;
      flex-shrink: 0;
    }

    .vid-title {
      color: #e5e7eb;
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 550px;
    }

    .vid-title:hover {
      color: var(--blue);
      text-decoration: underline;
    }

    .video-right {
      text-align: right;
      flex-shrink: 0;
    }

    .vid-delta {
      font-weight: 700;
      font-size: 13px;
    }

    .vid-total {
      font-size: 11px;
      color: var(--text-dim);
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: var(--text-dim);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="title-row">
        <div class="status-dot"></div>
        <h1>YouTube Realtime Pro</h1>
      </div>
      <div class="actions">
        <button class="btn" onclick="fetchData()">🔄 Làm mới</button>
      </div>
    </header>

    <!-- Cycle Countdown & Updated Status -->
    <div class="status-bar">
      <div>Kế tiếp: <span id="countdown" style="color: var(--blue); font-weight: 600;">--:--</span></div>
      <div id="updated-at">Cập nhật: --:--:--</div>
      <div>Chu kỳ cố định: :00, :15, :30, :45</div>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>

    <!-- Metric Filter Bar -->
    <div class="filter-bar">
      <div class="filter-group">
        <button class="filter-btn active" data-sort="v_60m" onclick="setSortMode('v_60m')">⏱ 60P</button>
        <button class="filter-btn" data-sort="v_30m" onclick="setSortMode('v_30m')">⚡ 30P</button>
        <button class="filter-btn" data-sort="v_24h" onclick="setSortMode('v_24h')">24H</button>
        <button class="filter-btn" data-sort="v_48h" onclick="setSortMode('v_48h')">48H</button>
        <button class="filter-btn" data-sort="v_7d" onclick="setSortMode('v_7d')">📅 7N</button>
        <button class="filter-btn" data-sort="v_30d" onclick="setSortMode('v_30d')">📅 30N</button>
        <button class="filter-btn" data-sort="v_90d" onclick="setSortMode('v_90d')">📅 90N</button>
        <button class="filter-btn" data-sort="total" onclick="setSortMode('total')">Toàn bộ</button>
      </div>
      <div style="font-size: 12px; color: var(--text-dim);">
        <span id="channel-count">0</span> Kênh
      </div>
    </div>

    <!-- Channels Container -->
    <div class="channels-list" id="channels-container"></div>
  </div>

  <script>
    let globalData = null;
    let currentSort = 'v_60m';
    let openedDrawers = new Set();
    let channelActiveTabs = {};

    function formatNumber(num) {
      if (num === null || num === undefined) return "+ -";
      return (num >= 0 ? "+" : "") + Number(num).toLocaleString();
    }

    function formatPlainNumber(num) {
      if (!num) return "0";
      return Number(num).toLocaleString();
    }

    function setSortMode(mode) {
      currentSort = mode;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.sort === mode);
      });
      renderList();
    }

    function toggleDrawer(chId) {
      if (openedDrawers.has(chId)) {
        openedDrawers.delete(chId);
      } else {
        openedDrawers.add(chId);
      }
      renderList();
    }

    function switchDetailTab(chId, tabName, event) {
      if (event) event.stopPropagation();
      channelActiveTabs[chId] = tabName;
      renderList();
    }

    async function fetchData() {
      try {
        const res = await fetch(`data.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("Chưa tìm thấy data.json");
        globalData = await res.json();
        updateHeaderStatus();
        renderList();
      } catch (err) {
        console.error(err);
      }
    }

    function updateHeaderStatus() {
      if (!globalData) return;
      if (globalData.updated_at) {
        const dt = new Date(globalData.updated_at);
        document.getElementById('updated-at').innerText = `Cập nhật: ${dt.toLocaleTimeString()}`;
      }
      const channels = Object.values(globalData.channels || {});
      document.getElementById('channel-count').innerText = channels.length;
    }

    function renderList() {
      if (!globalData || !globalData.channels) return;
      const container = document.getElementById('channels-container');
      const list = Object.values(globalData.channels);

      // Sắp xếp danh sách kênh
      list.sort((a, b) => {
        if (currentSort === 'total') {
          return (b.total_channel_views || 0) - (a.total_channel_views || 0);
        }
        return (b[currentSort] || 0) - (a[currentSort] || 0);
      });

      container.innerHTML = list.map((ch, index) => {
        const isOpen = openedDrawers.has(ch.id);
        const currentTab = channelActiveTabs[ch.id] || 'v_48h';
        const slices = ch.slices_15m || [0, 0, 0, 0];
        const maxSlice = Math.max(...slices, 1);

        // Render 4 thanh mini bar
        const barsHtml = slices.map((s, idx) => {
          const heightPercent = Math.max(8, Math.min(100, Math.round((s / maxSlice) * 100)));
          const isLatest = idx === 3;
          const hasView = s > 0;
          return `<div class="bar ${hasView ? 'has-view' : ''} ${isLatest ? 'latest' : ''}" 
                       style="height: ${heightPercent}%;" 
                       title="${idx === 3 ? '15p gần nhất' : (45 - idx * 15) + 'p trước'}: +${s}"></div>`;
        }).join('');

        // Badge cắn đề xuất & video cũ nổ
        const spikeBadge = ch.is_spike 
          ? `<span class="badge badge-viral">🔥 CẮN ĐỀ XUẤT</span>` : '';
        const revivedBadge = ch.has_revived_anomaly 
          ? `<span class="badge badge-revived" title="Lệch view 24h: +${formatPlainNumber(ch.anomaly_diff_24h)}">⚡ VIDEO CŨ NỔ</span>` : '';

        // Dữ liệu video trong drawer
        let drawerVideoListHtml = '';
        if (currentTab === 'revived') {
          const revList = ch.revived_videos || [];
          if (revList.length === 0) {
            drawerVideoListHtml = `<div class="empty-state">Chưa phát hiện video cũ nào tăng đột biến (≥ 100 view/ngày). Dữ liệu đối soát lúc 07:00 sáng.</div>`;
          } else {
            drawerVideoListHtml = revList.map((v, idx) => `
              <div class="video-item">
                <div class="video-left">
                  <span class="vid-rank">#${idx + 1}</span>
                  <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" class="vid-title" title="${v.title}">
                    ${v.title}
                  </a>
                </div>
                <div class="video-right">
                  <div class="vid-delta" style="color: var(--orange);">+${formatPlainNumber(v.v_delta_24h)}</div>
                  <div class="vid-total">Tổng: ${formatPlainNumber(v.views)}</div>
                </div>
              </div>
            `).join('');
          }
        } else {
          // Tab 100 video mới
          let sortedVideos = [...(ch.videos || [])];
          if (currentTab === 'v_48h') sortedVideos.sort((a, b) => (b.v_48h || 0) - (a.v_48h || 0));
          if (currentTab === 'v_60m') sortedVideos.sort((a, b) => (b.v_60m || 0) - (a.v_60m || 0));
          if (currentTab === 'latest') sortedVideos.sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

          if (sortedVideos.length === 0) {
            drawerVideoListHtml = `<div class="empty-state">Đang tải danh sách video...</div>`;
          } else {
            drawerVideoListHtml = sortedVideos.slice(0, 50).map((v, idx) => {
              const deltaVal = currentTab === 'v_60m' ? v.v_60m : v.v_48h;
              return `
                <div class="video-item">
                  <div class="video-left">
                    <span class="vid-rank">#${idx + 1}</span>
                    <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" class="vid-title" title="${v.title}">
                      ${v.title}
                    </a>
                  </div>
                  <div class="video-right">
                    <div class="vid-delta" style="color: ${currentTab === 'v_60m' ? 'var(--green)' : 'var(--blue)'};">
                      +${formatPlainNumber(deltaVal)}
                    </div>
                    <div class="vid-total">Tổng: ${formatPlainNumber(v.views)}</div>
                  </div>
                </div>
              `;
            }).join('');
          }
        }

        return `
          <div class="channel-card ${isOpen ? 'open' : ''}">
            <div class="channel-header" onclick="toggleDrawer('${ch.id}')">
              <div class="ch-title-wrap">
                <span class="ch-arrow">▶</span>
                <span class="ch-name">#${index + 1}. ${ch.title}</span>
                <div class="badges">
                  ${spikeBadge}
                  ${revivedBadge}
                </div>
              </div>
              <div class="ch-detail-btn">
                Chi tiết ▾
              </div>
            </div>

            <div class="ch-stats-overview">
              <span>${formatPlainNumber(ch.subs)} Subs</span>
              <span>•</span>
              <span>${formatPlainNumber(ch.videos_count)} Vid</span>
              <span>•</span>
              <span>Đang đo: 100 Vid mới</span>
            </div>

            <div class="metric-grid">
              <div class="metric-box">
                <span class="metric-label">48H (Toàn kênh)</span>
                <span class="metric-val">${formatNumber(ch.v_48h)}</span>
              </div>
              <div class="metric-box">
                <span class="metric-label">24H (Toàn kênh)</span>
                <span class="metric-val">${formatNumber(ch.v_24h)}</span>
              </div>
              <div class="metric-box">
                <span class="metric-label">⏱ 60P (100 vid)</span>
                <span class="metric-val green">${formatNumber(ch.v_60m)}</span>
              </div>
              <div class="slice-bars-wrap">
                <div class="slice-bars">
                  ${barsHtml}
                </div>
                <div class="slice-labels">
                  ${slices.map(s => `<span>+${s}</span>`).join('')}
                </div>
              </div>
            </div>

            <div class="long-term-row">
              <div class="lt-col">
                <span class="metric-label">7N</span>
                <span class="lt-val">${formatNumber(ch.v_7d)}</span>
              </div>
              <div class="lt-col">
                <span class="metric-label">30N</span>
                <span class="lt-val">${formatNumber(ch.v_30d)}</span>
              </div>
              <div class="lt-col">
                <span class="metric-label">90N (3T)</span>
                <span class="lt-val">${formatNumber(ch.v_90d)}</span>
              </div>
              <div class="lt-col">
                <span class="metric-label">TỔNG TOÀN KÊNH</span>
                <span class="lt-val">${formatPlainNumber(ch.total_channel_views)}</span>
              </div>
            </div>

            <!-- Drawer Chi Tiết Video -->
            <div class="drawer-content">
              <div class="drawer-tabs">
                <button class="tab-btn ${currentTab === 'v_48h' ? 'active' : ''}" 
                        onclick="switchDetailTab('${ch.id}', 'v_48h', event)">🔥 Top 48H</button>
                <button class="tab-btn ${currentTab === 'v_60m' ? 'active' : ''}" 
                        onclick="switchDetailTab('${ch.id}', 'v_60m', event)">⏱ Top 60P</button>
                <button class="tab-btn ${currentTab === 'latest' ? 'active' : ''}" 
                        onclick="switchDetailTab('${ch.id}', 'latest', event)">🕒 Mới nhất</button>
                <button class="tab-btn tab-revived ${currentTab === 'revived' ? 'active' : ''}" 
                        onclick="switchDetailTab('${ch.id}', 'revived', event)">
                  ⚡ Video Cũ Nổi Lên (${(ch.revived_videos || []).length})
                </button>
              </div>

              <div class="video-list-wrap">
                ${drawerVideoListHtml}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Đếm ngược chu kỳ 15 phút (:00, :15, :30, :45)
    function updateCountdown() {
      const now = new Date();
      const mins = now.getMinutes();
      const secs = now.getSeconds();
      const nextTargetMin = (Math.floor(mins / 15) + 1) * 15;
      const totalSecsRemaining = (nextTargetMin - mins) * 60 - secs;

      const m = Math.floor(totalSecsRemaining / 60);
      const s = totalSecsRemaining % 60;
      document.getElementById('countdown').innerText = 
        `${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;

      if (totalSecsRemaining <= 1) {
        setTimeout(fetchData, 4000);
      }
    }

    setInterval(updateCountdown, 1000);
    fetchData();
  </script>
</body>
</html>
