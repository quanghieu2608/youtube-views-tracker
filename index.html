<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube Realtime Pro</title>
  <style>
    :root {
      --bg: #090c10;
      --card-bg: #161b22;
      --card-sub: #0d1117;
      --primary: #58a6ff;
      --accent: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --subtext: #8b949e;
      --border: #30363d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 8px; padding-bottom: 60px; }

    header { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .header-row { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1rem; color: var(--text-bright); display: flex; align-items: center; gap: 6px; font-weight: 700; }
    .live-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); }

    .timer-pill { background: var(--card-sub); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; }
    .countdown-box { display: flex; align-items: center; gap: 6px; }
    .countdown { font-family: monospace; font-size: 0.85rem; font-weight: 700; color: var(--primary); }
    .btn-header { background: #21262d; border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; }
    .btn-header:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Progress Bar 15P */
    .progress-wrap { width: 100%; height: 4px; background: #21262d; border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .progress-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width 1s linear; }
    .meta-sub { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--subtext); margin-top: 5px; padding: 0 2px; }

    /* Form Thêm Kênh */
    .add-channel-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; display: none; }
    .add-channel-box.active { display: block; }
    .input-group { display: flex; gap: 6px; margin-top: 6px; }
    .input-box { background: var(--card-sub); border: 1px solid var(--border); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 0.78rem; flex: 1; outline: none; }
    .btn-action { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
    .btn-action:disabled { background: #333; color: #777; }
    .status-msg { font-size: 0.7rem; margin-top: 4px; }

    /* Controls & Tabs */
    .controls-wrapper { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .controls { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; flex: 1; }
    .btn-tab { background: var(--card-bg); border: 1px solid var(--border); color: var(--subtext); padding: 5px 12px; border-radius: 16px; font-size: 0.72rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-tab.active { background: var(--primary); color: #000; border-color: var(--primary); }

    .action-tools { display: flex; gap: 4px; white-space: nowrap; }
    .btn-tool { background: #21262d; border: 1px solid var(--border); color: var(--text-bright); padding: 5px 9px; border-radius: 16px; font-size: 0.7rem; font-weight: 600; cursor: pointer; }
    .btn-tool:hover { border-color: var(--primary); color: var(--primary); }
    .btn-tool.active-privacy { background: rgba(248, 81, 73, 0.2); border-color: var(--danger); color: #ff7b72; }

    /* Card Kênh & Thu Gọn */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; transition: all 0.2s ease; }
    .card-top { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .ch-title-wrap { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
    .toggle-icon { font-size: 0.7rem; color: var(--subtext); transition: transform 0.2s ease; }
    .ch-title { font-size: 0.95rem; font-weight: 700; color: var(--text-bright); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Lớp bảo vệ ẩn tên kênh */
    body.privacy-mode .ch-title-text { filter: blur(6px); user-select: none; pointer-events: none; }
    body.privacy-mode .v-title { filter: blur(5px); user-select: none; pointer-events: none; }

    .badges-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; }
    .badge-gray { background: #21262d; color: var(--subtext); }
    .badge-spike { background: #ffebe9; color: #cf222e; border: 1px solid #ff8182; animation: blink 1.5s infinite; }
    @keyframes blink { 50% { opacity: 0.6; } }

    /* Thu gọn Card */
    .card.is-collapsed { padding: 8px 12px; }
    .card.is-collapsed .toggle-icon { transform: rotate(-90deg); }
    .card.is-collapsed .card-body,
    .card.is-collapsed .video-drawer,
    .card.is-collapsed .badges-row { display: none !important; }

    /* HÀNG REALTIME: 48H - 24H - 60P TO */
    .stats-grid-custom { display: grid; grid-template-columns: 0.9fr 0.9fr 2.4fr; gap: 6px; margin-top: 8px; }
    .stat-box-compact { background: var(--card-sub); border: 1px solid var(--border); border-radius: 6px; padding: 6px 4px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
    .stat-label-compact { font-size: 0.62rem; color: var(--subtext); font-weight: 700; text-transform: uppercase; }
    .stat-val-compact { font-size: 0.92rem; font-weight: 800; margin-top: 3px; line-height: 1.1; }

    /* Ô 60P: 4 CỘT BIỂU ĐỒ 15P MINI-STUDIO */
    .box-60p-wrapper { background: var(--card-sub); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .box-60p-info { display: flex; flex-direction: column; justify-content: center; text-align: left; min-width: 52px; }
    .box-60p-title { font-size: 0.6rem; color: var(--subtext); font-weight: 700; text-transform: uppercase; }
    .box-60p-total { font-size: 1.05rem; font-weight: 800; color: var(--accent); margin-top: 2px; }

    /* 4 CỘT BAR 15 PHÚT */
    .bars-container-4 { display: flex; align-items: flex-end; gap: 4px; height: 44px; flex: 1; justify-content: flex-end; }
    .bar-col-4 { display: flex; flex-direction: column; align-items: center; flex: 1; max-width: 40px; height: 100%; justify-content: flex-end; }
    .bar-track-4 { width: 100%; height: 32px; background: rgba(255,255,255,0.04); border-radius: 3px 3px 0 0; display: flex; align-items: flex-end; }
    .bar-fill-4 { width: 100%; border-radius: 2px 2px 0 0; transition: height 0.4s ease; min-height: 2px; }
    .bar-val-4 { font-size: 0.52rem; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin-top: 2px; line-height: 1; white-space: nowrap; }

    /* Dải Dài Hạn */
    .longterm-strip { margin-top: 6px; background: var(--card-sub); border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
    .lt-item { display: flex; flex-direction: column; }
    .lt-label { font-size: 0.58rem; color: var(--subtext); font-weight: 600; }
    .lt-val { font-size: 0.78rem; font-weight: 700; color: var(--text-bright); margin-top: 1px; }

    /* Sparkline */
    .sparkline-container { margin-top: 6px; background: var(--card-sub); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; display: flex; justify-content: space-between; align-items: center; }
    .sparkline-title { font-size: 0.6rem; color: var(--subtext); font-weight: 600; }
    .sparkline-bars { font-family: monospace; font-size: 0.85rem; color: var(--primary); letter-spacing: 1px; }

    /* Video Drawer */
    .video-drawer { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; display: none; }
    .drawer-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .btn-delete-channel { background: rgba(248, 81, 73, 0.1); border: 1px solid var(--danger); color: var(--danger); font-size: 0.65rem; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .btn-delete-channel:hover { background: var(--danger); color: #fff; }

    .v-item { padding: 8px 0; border-bottom: 1px solid #21262d; }
    .v-item:last-child { border-bottom: none; }
    .v-title-row { display: flex; justify-content: space-between; gap: 6px; }
    .v-title { color: var(--text-bright); font-size: 0.78rem; text-decoration: none; font-weight: 500; line-height: 1.3; flex: 1; }
    .v-metrics { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 0.68rem; }
    .v-growth { display: flex; gap: 6px; font-weight: 700; font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <div class="header-row">
      <h1><span class="live-dot"></span> YouTube Realtime Pro</h1>
      <div style="display:flex; gap:5px;">
        <button class="btn-header" onclick="toggleAddBox()">➕ Thêm</button>
        <button class="btn-header" id="btnTriggerScan" onclick="triggerRunWorkflow()">⚡ Quét Ngay</button>
      </div>
    </div>
    <div class="timer-pill">
      <div class="countdown-box">
        <span id="timerLabel" style="color:var(--subtext);">Kế tiếp:</span>
        <span class="countdown" id="timer">--:--</span>
      </div>
      <span class="badge badge-gray" id="channelSummary">...</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill" id="progressBar"></div>
    </div>
    <div class="meta-sub">
      <span id="lastUpdatedLabel">Cập nhật: --:--:--</span>
      <span>Chu kỳ: :00, :15, :30, :45</span>
    </div>
  </header>

  <!-- Form Thêm Kênh Nhanh -->
  <div class="add-channel-box" id="addChannelBox">
    <div style="font-size:0.75rem; font-weight:bold; color:var(--text-bright);">Thêm kênh mới và quét ngay:</div>
    <div class="input-group">
      <input type="text" id="channelInput" class="input-box" placeholder="Dán Channel ID (UC...)">
      <button class="btn-action" id="btnAdd" onclick="submitNewChannel()">Thêm & Quét</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <!-- Thanh Lọc & Công cụ Nâng cao -->
  <div class="controls-wrapper">
    <div class="controls">
      <button class="btn-tab active" onclick="changeSort('60m')">⏱ 60P</button>
      <button class="btn-tab" onclick="changeSort('30m')">⚡ 30P</button>
      <button class="btn-tab" onclick="changeSort('24h')">24H</button>
      <button class="btn-tab" onclick="changeSort('48h')">48H</button>
      <button class="btn-tab" onclick="changeSort('d_7')">📅 7N</button>
      <button class="btn-tab" onclick="changeSort('d_30')">📅 30N</button>
      <button class="btn-tab" onclick="changeSort('d_90')">📅 90N</button>
      <button class="btn-tab" onclick="changeSort('total')">Toàn bộ</button>
    </div>
    <div class="action-tools">
      <button class="btn-tool" id="btnPrivacy" onclick="togglePrivacyMode()">👁️ Ẩn Tên</button>
      <button class="btn-tool" onclick="collapseAll(true)">▲ Gọn</button>
      <button class="btn-tool" onclick="collapseAll(false)">▼ Mở</button>
    </div>
  </div>

  <div id="appContainer">Đang tải dữ liệu...</div>

  <script>
    const REPO_OWNER = 'quanghieu2608';
    const REPO_NAME = 'youtube-views-tracker';
    const WORKFLOW_ID = 'track.yml';
    const TOTAL_CYCLE_SECONDS = 15 * 60;

    let db = null;
    let sortMode = '60m';
    let nextTarget = null;
    let isFetching = false;
    let pollInterval = null;

    // Lưu trữ số view cũ của từng thành phần để tạo hiệu ứng chạy số
    const previousValues = {};

    function getStoredToken() {
      let token = localStorage.getItem('gh_token');
      if (!token) {
        token = prompt("Vui lòng dán GitHub Personal Access Token (ghp_...):");
        if (token) localStorage.setItem('gh_token', token.trim());
      }
      return token;
    }

    /* --- HIỆU ỨNG CHẠY SỐ (NUMBER TICKER ANIMATION) --- */
    function animateValue(elementId, start, end, prefix = '+', duration = 1300) {
      const el = document.getElementById(elementId);
      if (!el) return;

      if (start === end) {
        el.innerText = `${prefix}${end.toLocaleString()}`;
        return;
      }

      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        // Hàm làm mượt Ease-Out
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const current = Math.floor(start + (end - start) * easeOut);
        el.innerText = `${prefix}${current.toLocaleString()}`;
        if (progress < 1) {
          window.requestAnimationFrame(step);
        } else {
          el.innerText = `${prefix}${end.toLocaleString()}`;
        }
      };
      window.requestAnimationFrame(step);
    }

    /* --- CHẾ ĐỘ ẨN TÊN KÊNH (PRIVACY MODE) --- */
    function togglePrivacyMode() {
      const isPrivacy = document.body.classList.toggle('privacy-mode');
      const btn = document.getElementById('btnPrivacy');
      if (isPrivacy) {
        btn.innerText = "🔒 Đã Ẩn Tên";
        btn.classList.add('active-privacy');
        localStorage.setItem('privacy_mode', 'true');
      } else {
        btn.innerText = "👁️ Ẩn Tên";
        btn.classList.remove('active-privacy');
        localStorage.removeItem('privacy_mode');
      }
    }

    function initPrivacyMode() {
      if (localStorage.getItem('privacy_mode') === 'true') {
        document.body.classList.add('privacy-mode');
        const btn = document.getElementById('btnPrivacy');
        if (btn) {
          btn.innerText = "🔒 Đã Ẩn Tên";
          btn.classList.add('active-privacy');
        }
      }
    }

    async function triggerRunWorkflow() {
      const btn = document.getElementById('btnTriggerScan');
      const timerLabel = document.getElementById('timerLabel');
      const token = getStoredToken();
      if (!token) return;

      btn.disabled = true;
      btn.innerText = "⏳ Đang chạy...";
      timerLabel.innerText = "⏳ Đang quét Actions...";

      try {
        const triggerUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`;
        const res = await fetch(triggerUrl, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ ref: 'main' })
        });

        if (!res.ok) throw new Error("Lỗi Token hoặc quyền hạn Workflow!");

        let tries = 0;
        const scanPoll = setInterval(async () => {
          tries++;
          const hasNew = await loadData();
          if (hasNew || tries > 12) {
            clearInterval(scanPoll);
            btn.disabled = false;
            btn.innerText = "⚡ Quét Ngay";
          }
        }, 5000);
      } catch (err) {
        alert("Lỗi kích hoạt: " + err.message);
        btn.disabled = false;
        btn.innerText = "⚡ Quét Ngay";
        timerLabel.innerText = "Kế tiếp:";
      }
    }

    function getCollapsedChannels() {
      try {
        return JSON.parse(localStorage.getItem('collapsed_channels') || '{}');
      } catch (e) {
        return {};
      }
    }

    function toggleCollapse(chId, event) {
      if (event) event.stopPropagation();
      const card = document.getElementById(`card-${chId}`);
      if (!card) return;

      const collapsedMap = getCollapsedChannels();
      const isNowCollapsed = !card.classList.contains('is-collapsed');

      if (isNowCollapsed) {
        card.classList.add('is-collapsed');
        collapsedMap[chId] = true;
      } else {
        card.classList.remove('is-collapsed');
        delete collapsedMap[chId];
      }
      localStorage.setItem('collapsed_channels', JSON.stringify(collapsedMap));
    }

    function collapseAll(isCollapse) {
      if (!db || !db.channels) return;
      const collapsedMap = {};

      Object.keys(db.channels).forEach(chId => {
        const card = document.getElementById(`card-${chId}`);
        if (card) {
          if (isCollapse) {
            card.classList.add('is-collapsed');
            collapsedMap[chId] = true;
          } else {
            card.classList.remove('is-collapsed');
          }
        }
      });
      localStorage.setItem('collapsed_channels', JSON.stringify(collapsedMap));
    }

    function toggleAddBox() {
      document.getElementById('addChannelBox').classList.toggle('active');
    }

    async function submitNewChannel() {
      const input = document.getElementById('channelInput');
      const msg = document.getElementById('statusMsg');
      const btn = document.getElementById('btnAdd');
      const rawVal = input.value.trim();

      if (!rawVal) {
        msg.innerHTML = '<span style="color:var(--danger)">Vui lòng nhập ID kênh!</span>';
        return;
      }

      let chId = rawVal;
      if (rawVal.includes('/channel/')) {
        chId = rawVal.split('/channel/')[1].split('/')[0].split('?')[0];
      }

      const token = getStoredToken();
      if (!token) return;

      btn.disabled = true;
      msg.innerHTML = '<span style="color:var(--primary)">1/2. Đang ghi file channels.txt...</span>';

      try {
        const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/channels.txt`;
        const res = await fetch(getUrl, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error("Sai Token hoặc không có quyền ghi repository!");
        const data = await res.json();
        const currentContent = decodeURIComponent(escape(atob(data.content)));

        if (!currentContent.includes(chId)) {
          const updatedContent = currentContent.trim() + '\n' + chId + '\n';
          await fetch(getUrl, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: `Add ${chId} via App`,
              content: btoa(unescape(encodeURIComponent(updatedContent))),
              sha: data.sha
            })
          });
        }

        msg.innerHTML = '<span style="color:var(--accent)">2/2. Đang kích hoạt Action track.yml...</span>';
        const triggerUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`;
        await fetch(triggerUrl, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ ref: 'main' })
        });

        msg.innerHTML = '<span style="color:var(--accent)">✅ Đã thêm! Trang tự làm mới sau 20s...</span>';
        input.value = '';
        setTimeout(() => { loadData(true); toggleAddBox(); msg.innerHTML = ''; }, 20000);
      } catch (err) {
        msg.innerHTML = `<span style="color:var(--danger)">Lỗi: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteChannel(chId, chTitle) {
      const confirmDel = confirm(`Bạn có chắc muốn XÓA kênh "${chTitle}"?`);
      if (!confirmDel) return;

      const token = getStoredToken();
      if (!token) return;

      const cardEl = document.getElementById(`card-${chId}`);
      if (cardEl) cardEl.style.opacity = '0.3';

      try {
        const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/channels.txt`;
        const res = await fetch(getUrl, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error("Không thể đọc file channels.txt từ GitHub!");
        const data = await res.json();
        const currentContent = decodeURIComponent(escape(atob(data.content)));

        const lines = currentContent.split('\n').map(l => l.trim()).filter(l => l && l !== chId);
        const updatedContent = lines.join('\n') + '\n';

        await fetch(getUrl, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: `Remove ${chId} via App`,
            content: btoa(unescape(encodeURIComponent(updatedContent))),
            sha: data.sha
          })
        });

        const triggerUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`;
        await fetch(triggerUrl, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ ref: 'main' })
        });

        if (db && db.channels && db.channels[chId]) {
          delete db.channels[chId];
          render();
        }
        alert(`Đã xóa thành công kênh "${chTitle}"!`);
      } catch (err) {
        alert("Lỗi khi xóa: " + err.message);
        if (cardEl) cardEl.style.opacity = '1';
      }
    }

    async function loadData(manual = false) {
      const timerLabel = document.getElementById('timerLabel');

      try {
        const res = await fetch('data.json?t=' + Date.now());
        const newData = await res.json();

        if (db && db.updated_at === newData.updated_at && !manual) {
          return false;
        }

        db = newData;
        calcNextCronTarget();
        render();

        if (db.updated_at) {
          const dt = new Date(db.updated_at);
          document.getElementById('lastUpdatedLabel').innerText = `Cập nhật: ${dt.toLocaleTimeString()}`;
        }
        timerLabel.innerText = "Kế tiếp:";
        return true;
      } catch (e) {
        if (!db) {
          document.getElementById('appContainer').innerHTML = '<div style="color:var(--danger); padding:20px; text-align:center;">Chưa tải được dữ liệu.</div>';
        }
        return false;
      }
    }

    function calcNextCronTarget() {
      const now = new Date();
      const m = now.getMinutes();
      nextTarget = new Date(now);
      const nextMin = (Math.floor(m / 15) + 1) * 15;

      if (nextMin === 60) {
        nextTarget.setHours(now.getHours() + 1);
        nextTarget.setMinutes(0, 0, 0);
      } else {
        nextTarget.setMinutes(nextMin, 0, 0);
      }
    }

    setInterval(() => {
      if (!nextTarget) return;
      const now = new Date();
      const diff = Math.floor((nextTarget - now) / 1000);
      const timerEl = document.getElementById('timer');
      const timerLabel = document.getElementById('timerLabel');
      const progressBar = document.getElementById('progressBar');

      if (diff <= 0) {
        timerLabel.innerText = "⏳ Đang cập nhật...";
        timerEl.innerText = "--:--";
        if (progressBar) progressBar.style.width = "0%";

        if (!pollInterval && !isFetching) {
          isFetching = true;
          loadData().then(success => {
            isFetching = false;
            if (success && pollInterval) {
              clearInterval(pollInterval);
              pollInterval = null;
            }
          });

          pollInterval = setInterval(async () => {
            if (isFetching) return;
            isFetching = true;
            const hasNewData = await loadData();
            isFetching = false;

            if (hasNewData) {
              clearInterval(pollInterval);
              pollInterval = null;
            }
          }, 10000);
        }
      } else {
        if (pollInterval) {
          clearInterval(pollInterval);
          pollInterval = null;
        }

        const mins = String(Math.floor(diff / 60)).padStart(2, '0');
        const secs = String(diff % 60).padStart(2, '0');
        timerLabel.innerText = "Kế tiếp:";
        timerEl.innerText = `${mins}m ${secs}s`;

        if (progressBar) {
          const pct = Math.max(0, Math.min(100, (diff / TOTAL_CYCLE_SECONDS) * 100));
          progressBar.style.width = pct + "%";
        }
      }
    }, 1000);

    function changeSort(mode) {
      sortMode = mode;
      document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function compute15mSlices(ch) {
      const history = ch.history || [];
      const currentViews = ch.views || 0;
      const total60 = ch.v_60m || 0;

      if (history.length >= 2) {
        const nowTs = new Date(db.updated_at || Date.now()).getTime();

        const findViewsAt = (targetMinutesAgo) => {
          const targetTs = nowTs - (targetMinutesAgo * 60 * 1000);
          let closest = null;
          let minDiff = Infinity;
          for (let item of history) {
            const itemTs = new Date(item[0]).getTime();
            const diff = Math.abs(itemTs - targetTs);
            if (diff < minDiff) {
              minDiff = diff;
              closest = item;
            }
          }
          return closest ? closest[1] : null;
        };

        const v15 = findViewsAt(15);
        const v30 = findViewsAt(30);
        const v45 = findViewsAt(45);
        const v60 = findViewsAt(60);

        if (v15 !== null && v30 !== null) {
          const c4 = Math.max(0, currentViews - v15);
          const c3 = Math.max(0, v15 - v30);
          const c2 = v45 !== null ? Math.max(0, v30 - v45) : Math.max(0, Math.round((v30 - (v60 || (currentViews - total60))) / 2));
          const c1 = Math.max(0, total60 - (c4 + c3 + c2));
          return [c1, c2, c3, c4];
        }
      }

      const v_curr_30 = ch.v_30m || 0;
      const v_prev_30 = Math.max(0, total60 - v_curr_30);
      const c4 = Math.round(v_curr_30 * 0.55);
      const c3 = Math.max(0, v_curr_30 - c4);
      const c2 = Math.round(v_prev_30 * 0.55);
      const c1 = Math.max(0, v_prev_30 - c2);
      return [c1, c2, c3, c4];
    }

    function render() {
      if (!db || !db.channels) return;
      const chList = Object.values(db.channels);
      document.getElementById('channelSummary').innerText = `${chList.length} Kênh`;

      chList.sort((a, b) => {
        if (sortMode === '60m') return (b.v_60m || 0) - (a.v_60m || 0) || (b.views - a.views);
        if (sortMode === '30m') return (b.v_30m || 0) - (a.v_30m || 0) || (b.views - a.views);
        if (sortMode === '24h') return (b.v_24h || 0) - (a.v_24h || 0) || (b.views - a.views);
        if (sortMode === '48h') return (b.v_48h || 0) - (a.v_48h || 0) || (b.views - a.views);
        if (sortMode === 'd_7') return (b.longterm?.d_7 || 0) - (a.longterm?.d_7 || 0);
        if (sortMode === 'd_30') return (b.longterm?.d_30 || 0) - (a.longterm?.d_30 || 0);
        if (sortMode === 'd_90') return (b.longterm?.d_90 || 0) - (a.longterm?.d_90 || 0);
        return (b.views || 0) - (a.views || 0);
      });

      const container = document.getElementById('appContainer');
      container.innerHTML = '';
      const collapsedMap = getCollapsedChannels();

      chList.forEach((ch, idx) => {
        const lt = ch.longterm || { d_7: 0, d_30: 0, d_90: 0 };
        const isCollapsed = !!collapsedMap[ch.id];

        const [c1, c2, c3, c4] = compute15mSlices(ch);
        const v_total_60 = ch.v_60m || (c1 + c2 + c3 + c4);

        const maxVal = Math.max(c1, c2, c3, c4, 1);
        const h1 = Math.max(8, Math.round((c1 / maxVal) * 100));
        const h2 = Math.max(8, Math.round((c2 / maxVal) * 100));
        const h3 = Math.max(8, Math.round((c3 / maxVal) * 100));
        const h4 = Math.max(8, Math.round((c4 / maxVal) * 100));

        const c4Color = c4 >= c3 ? 'var(--accent)' : 'var(--warning)';

        const card = document.createElement('div');
        card.className = `card ${isCollapsed ? 'is-collapsed' : ''}`;
        card.id = `card-${ch.id}`;
        card.innerHTML = `
          <div class="card-top" onclick="toggleCollapse('${ch.id}', event)">
            <div class="ch-title-wrap">
              <span class="toggle-icon">▼</span>
              <div class="ch-title">
                #${idx + 1}. <span class="ch-title-text">${ch.title || 'Kênh'}</span>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
              ${ch.is_spike ? `<span class="badge badge-spike">🔥 CẮN ĐỀ XUẤT</span>` : ''}
              <span style="font-size:0.68rem; color:var(--primary);" onclick="event.stopPropagation(); toggleDrawer('${ch.id}')">Chi tiết ▾</span>
            </div>
          </div>

          <div class="badges-row">
            <span class="badge badge-gray">${(ch.subs || 0).toLocaleString()} Subs</span>
            <span class="badge badge-gray">${ch.videos_count || 0} Vid</span>
            <span class="badge badge-gray">Pool: 100 Vid</span>
          </div>

          <div class="card-body">
            <div class="stats-grid-custom">
              <div class="stat-box-compact">
                <div class="stat-label-compact">48H</div>
                <div class="stat-val-compact" id="val-48h-${ch.id}" style="color:var(--primary);">+0</div>
              </div>

              <div class="stat-box-compact">
                <div class="stat-label-compact">24H</div>
                <div class="stat-val-compact" id="val-24h-${ch.id}" style="color:var(--primary);">+0</div>
              </div>

              <div class="box-60p-wrapper">
                <div class="box-60p-info">
                  <div class="box-60p-title">⏱ 60P</div>
                  <div class="box-60p-total" id="val-60p-${ch.id}">+0</div>
                </div>

                <div class="bars-container-4">
                  <div class="bar-col-4">
                    <div class="bar-track-4">
                      <div class="bar-fill-4" style="height: ${h1}%; background: #265999;"></div>
                    </div>
                    <span class="bar-val-4" id="val-c1-${ch.id}" style="color: #58a6ff;">+0</span>
                  </div>

                  <div class="bar-col-4">
                    <div class="bar-track-4">
                      <div class="bar-fill-4" style="height: ${h2}%; background: #388bfd;"></div>
                    </div>
                    <span class="bar-val-4" id="val-c2-${ch.id}" style="color: #58a6ff;">+0</span>
                  </div>

                  <div class="bar-col-4">
                    <div class="bar-track-4">
                      <div class="bar-fill-4" style="height: ${h3}%; background: #388bfd;"></div>
                    </div>
                    <span class="bar-val-4" id="val-c3-${ch.id}" style="color: #58a6ff;">+0</span>
                  </div>

                  <div class="bar-col-4">
                    <div class="bar-track-4">
                      <div class="bar-fill-4" style="height: ${h4}%; background: ${c4Color};"></div>
                    </div>
                    <span class="bar-val-4" id="val-c4-${ch.id}" style="color: ${c4Color};">+0</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="longterm-strip">
              <div class="lt-item">
                <span class="lt-label">7N</span>
                <span class="lt-val">+${lt.d_7 > 0 ? lt.d_7.toLocaleString() : '-'}</span>
              </div>
              <div class="lt-item">
                <span class="lt-label">30N</span>
                <span class="lt-val">+${lt.d_30 > 0 ? lt.d_30.toLocaleString() : '-'}</span>
              </div>
              <div class="lt-item">
                <span class="lt-label">90N (3T)</span>
                <span class="lt-val">+${lt.d_90 > 0 ? lt.d_90.toLocaleString() : '-'}</span>
              </div>
              <div class="lt-item">
                <span class="lt-label">TỔNG TOÀN KÊNH</span>
                <span class="lt-val">${(ch.total_channel_views || ch.views || 0).toLocaleString()}</span>
              </div>
            </div>

            <div class="sparkline-container">
              <span class="sparkline-title">48H:</span>
              <span class="sparkline-bars">${ch.sparkline && ch.sparkline.trim() ? ch.sparkline : ' ▂▃▅▆▇█'}</span>
            </div>
          </div>

          <div class="video-drawer" id="box-${ch.id}">
            <div class="drawer-header-row">
              <span style="font-size:0.7rem; font-weight:700; color:var(--subtext);">DANH SÁCH 50 VIDEO VIEW CAO NHẤT (POOL):</span>
              <button class="btn-delete-channel" onclick="deleteChannel('${ch.id}', '${ch.title ? ch.title.replace(/'/g, "\\'") : 'Kênh'}')">🗑 Xóa kênh này</button>
            </div>
            ${renderVideos(ch.videos)}
          </div>
        `;
        container.appendChild(card);

        // KÍCH HOẠT HIỆU ỨNG CHẠY SỐ CÁC MỐC
        const old48h = previousValues[`48h-${ch.id}`] || 0;
        const old24h = previousValues[`24h-${ch.id}`] || 0;
        const old60p = previousValues[`60p-${ch.id}`] || 0;
        const oldC1 = previousValues[`c1-${ch.id}`] || 0;
        const oldC2 = previousValues[`c2-${ch.id}`] || 0;
        const oldC3 = previousValues[`c3-${ch.id}`] || 0;
        const oldC4 = previousValues[`c4-${ch.id}`] || 0;

        animateValue(`val-48h-${ch.id}`, old48h, ch.v_48h || 0);
        animateValue(`val-24h-${ch.id}`, old24h, ch.v_24h || 0);
        animateValue(`val-60p-${ch.id}`, old60p, v_total_60);
        animateValue(`val-c1-${ch.id}`, oldC1, c1);
        animateValue(`val-c2-${ch.id}`, oldC2, c2);
        animateValue(`val-c3-${ch.id}`, oldC3, c3);
        animateValue(`val-c4-${ch.id}`, oldC4, c4);

        // Lưu lại làm mốc xuất phát cho lần làm mới sau
        previousValues[`48h-${ch.id}`] = ch.v_48h || 0;
        previousValues[`24h-${ch.id}`] = ch.v_24h || 0;
        previousValues[`60p-${ch.id}`] = v_total_60;
        previousValues[`c1-${ch.id}`] = c1;
        previousValues[`c2-${ch.id}`] = c2;
        previousValues[`c3-${ch.id}`] = c3;
        previousValues[`c4-${ch.id}`] = c4;
      });
    }

    function renderVideos(videos) {
      if (!videos || !videos.length) return '<div style="font-size:0.7rem; color:var(--subtext);">Chưa có video</div>';
      return videos.slice(0, 15).map(v => `
        <div class="v-item">
          <div class="v-title-row">
            <a class="v-title" href="https://youtu.be/${v.id}" target="_blank">${v.title}</a>
          </div>
          <div class="v-metrics">
            <span style="color:var(--subtext);">Xuất bản: ${v.published_at ? v.published_at.slice(0,10) : ''}</span>
            <div class="v-growth">
              <span style="color:var(--accent);">👁 ${(v.views || 0).toLocaleString()}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleDrawer(id) {
      const el = document.getElementById('box-' + id);
      if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    initPrivacyMode();
    calcNextCronTarget();
    loadData();
  </script>
</body>
</html>
