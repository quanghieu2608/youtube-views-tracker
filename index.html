<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube Realtime Pro</title>
  <style>
    :root {
      --bg: #090c10;
      --card-bg: #161b22;
      --card-sub: #0d1117;
      --primary: #58a6ff;
      --accent: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
      --orange: #f0883e;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --subtext: #8b949e;
      --border: #30363d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background: var(--bg); 
      color: var(--text); 
      padding: 10px 12px; 
      padding-bottom: 60px; 
      max-width: 1600px;
      margin: 0 auto;
    }

    header { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .header-row { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1rem; color: var(--text-bright); display: flex; align-items: center; gap: 6px; font-weight: 700; }
    
    .live-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); transition: all 0.3s; }
    .live-dot.syncing { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
    .live-dot.flash-white { 
      background: #ffffff !important; 
      box-shadow: 0 0 12px #ffffff !important; 
      animation: pulseWhite 0.25s infinite alternate !important; 
    }
    @keyframes pulseWhite { from { opacity: 0.3; transform: scale(0.85); } to { opacity: 1; transform: scale(1.2); } }

    .timer-pill { background: var(--card-sub); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; }
    .countdown-box { display: flex; align-items: center; gap: 6px; }
    .countdown { font-family: monospace; font-size: 0.85rem; font-weight: 700; color: var(--primary); }
    .btn-header { background: #21262d; border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; }
    .btn-header:disabled { opacity: 0.5; cursor: not-allowed; }

    .progress-wrap { width: 100%; height: 4px; background: #21262d; border-radius: 2px; margin-top: 6px; overflow: hidden; position: relative; }
    .progress-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width 0.8s linear; }
    .progress-fill.syncing-mode { background: linear-gradient(90deg, var(--warning), #ffb020); }
    .progress-fill.rush-to-finish { 
      background: linear-gradient(90deg, #ffffff, var(--accent)) !important; 
      transition: width 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) !important; 
    }

    .meta-sub { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--subtext); margin-top: 5px; padding: 0 2px; }

    .add-channel-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; display: none; }
    .add-channel-box.active { display: block; }
    .input-group { display: flex; gap: 6px; margin-top: 6px; }
    .input-box { background: var(--card-sub); border: 1px solid var(--border); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 0.78rem; flex: 1; outline: none; }
    .btn-action { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
    .btn-action:disabled { background: #333; color: #777; }
    .status-msg { font-size: 0.7rem; margin-top: 4px; }

    .controls-wrapper { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .controls { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; flex: 1; scrollbar-width: none; }
    .controls::-webkit-scrollbar { display: none; }
    .btn-tab { background: var(--card-bg); border: 1px solid var(--border); color: var(--subtext); padding: 6px 12px; border-radius: 16px; font-size: 0.72rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-tab.active { background: var(--primary); color: #000; border-color: var(--primary); }

    .action-tools { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-icon-toggle {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text-bright);
      width: 36px;
      height: 32px;
      padding: 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .btn-icon-toggle:active { transform: scale(0.92); }
    
    /* Nút mắt: Giữ nguyên kích thước và màu nền, chỉ đổi opacity dịu mắt khi bật */
    .btn-icon-toggle.eye-active {
      color: var(--primary);
      background: #1c2128;
      border-color: #388bfd66;
    }

    /* BỐ CỤC ĐA CỘT (RESPONSIVE GRID): 1 CỘT TRÊN MOBILE, 2-3 CỘT TRÊN MÁY TÍNH */
    #appContainer {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      align-items: start;
    }
    @media (min-width: 820px) {
      #appContainer {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (min-width: 1260px) {
      #appContainer {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .card { 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 10px 12px; 
      margin-bottom: 0; 
      transition: all 0.2s ease; 
      width: 100%;
    }
    .card-top { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .ch-title-wrap { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
    .toggle-icon { font-size: 0.7rem; color: var(--subtext); transition: transform 0.2s ease; }
    .ch-title { font-size: 0.95rem; font-weight: 700; color: var(--text-bright); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    body.privacy-mode .ch-title-text { filter: blur(7px); user-select: none; pointer-events: none; }
    body.privacy-mode .v-title { filter: blur(6px); user-select: none; pointer-events: none; }

    .badges-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; }
    .badge-gray { background: #21262d; color: var(--subtext); }
    .badge-spike { background: #ffebe9; color: #cf222e; border: 1px solid #ff8182; animation: blink 1.5s infinite; }
    .badge-revived { background: rgba(240, 136, 62, 0.15); color: #ffa657; border: 1px solid rgba(240, 136, 62, 0.4); }
    @keyframes blink { 50% { opacity: 0.6; } }

    .card.is-collapsed { padding: 8px 12px; }
    .card.is-collapsed .toggle-icon { transform: rotate(-90deg); }
    .card.is-collapsed .card-body,
    .card.is-collapsed .video-drawer,
    .card.is-collapsed .badges-row { display: none !important; }

    /* NHÓM LUỒNG 1: 48H & 60P */
    .stream-header { font-size: 0.58rem; color: var(--subtext); font-weight: 700; text-transform: uppercase; margin-top: 8px; margin-bottom: 4px; letter-spacing: 0.5px; display: flex; justify-content: space-between; }
    .stream1-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    
    .box-stream1 { background: var(--card-sub); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; justify-content: space-between; min-height: 80px; }
    .box-header-metric { display: flex; justify-content: space-between; align-items: baseline; }
    .metric-label { font-size: 0.62rem; color: var(--subtext); font-weight: 700; text-transform: uppercase; }
    .metric-val-main { font-size: 1.05rem; font-weight: 800; line-height: 1.1; }

    /* Biểu đồ 48 cột */
    .bars-container-48 { display: flex; align-items: flex-end; gap: 1.5px; height: 38px; width: 100%; margin-top: 6px; background: rgba(255,255,255,0.02); border-radius: 3px; padding: 2px 1px; }
    .bar-col-48 { flex: 1; height: 100%; display: flex; align-items: flex-end; }
    .bar-fill-48 { width: 100%; background: #265999; border-radius: 1px 1px 0 0; min-height: 2px; transition: height 0.3s ease; }
    .bar-col-48:hover .bar-fill-48 { background: var(--primary); }

    /* Biểu đồ 4 cột 15P */
    .bars-container-4 { display: flex; align-items: flex-end; gap: 4px; height: 38px; width: 100%; margin-top: 6px; }
    .bar-col-4 { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: flex-end; }
    .bar-track-4 { width: 100%; height: 26px; background: rgba(255,255,255,0.04); border-radius: 3px 3px 0 0; display: flex; align-items: flex-end; }
    .bar-fill-4 { width: 100%; border-radius: 2px 2px 0 0; transition: height 0.4s ease; min-height: 2px; }
    .bar-val-4 { font-size: 0.52rem; font-weight: 700; margin-top: 2px; line-height: 1; white-space: nowrap; }

    /* NHÓM LUỒNG 2: 24H & 48H Full Catalog */
    .stream2-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .stat-box-catalog { background: var(--card-sub); border: 1px dashed var(--border); border-radius: 6px; padding: 5px 8px; text-align: center; }
    .stat-label-catalog { font-size: 0.58rem; color: var(--orange); font-weight: 700; text-transform: uppercase; }
    .stat-val-catalog { font-size: 0.92rem; font-weight: 800; margin-top: 2px; color: var(--text-bright); }

    /* NHÓM LUỒNG 3: Dài hạn */
    .longterm-strip { margin-top: 6px; background: var(--card-sub); border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
    .lt-item { display: flex; flex-direction: column; }
    .lt-label { font-size: 0.58rem; color: var(--subtext); font-weight: 600; }
    .lt-val { font-size: 0.78rem; font-weight: 700; color: var(--text-bright); margin-top: 1px; }

    .video-drawer { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; display: none; }
    .drawer-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
    .v-tabs-group { display: flex; gap: 4px; background: var(--card-sub); padding: 2px; border-radius: 6px; border: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
    .v-tabs-group::-webkit-scrollbar { display: none; }
    .btn-v-tab { background: transparent; border: none; color: var(--subtext); padding: 4px 8px; font-size: 0.65rem; font-weight: 700; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    .btn-v-tab.active { background: #21262d; color: var(--text-bright); }
    .btn-v-tab.tab-orange.active { background: rgba(240, 136, 62, 0.2); color: var(--orange); }

    .btn-delete-channel { background: rgba(248, 81, 73, 0.1); border: 1px solid var(--danger); color: var(--danger); font-size: 0.65rem; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .btn-delete-channel:hover { background: var(--danger); color: #fff; }

    .v-scroll-area { max-height: 380px; overflow-y: auto; padding-right: 4px; }
    .v-scroll-area::-webkit-scrollbar { width: 4px; }
    .v-scroll-area::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

    .v-item { padding: 8px 0; border-bottom: 1px solid #21262d; }
    .v-item:last-child { border-bottom: none; }
    .v-title-row { display: flex; justify-content: space-between; gap: 6px; }
    .v-title { color: var(--text-bright); font-size: 0.78rem; text-decoration: none; font-weight: 500; line-height: 1.3; flex: 1; }
    .v-metrics { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 0.68rem; }
    .v-growth { font-weight: 700; font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <div class="header-row">
      <h1><span class="live-dot" id="liveDot"></span> YouTube Realtime Pro</h1>
      <div style="display:flex; gap:5px;">
        <button class="btn-header" onclick="toggleAddBox()">➕ Thêm</button>
        <button class="btn-header" id="btnTriggerScan" onclick="triggerRunWorkflow()">⚡ Quét Ngay</button>
      </div>
    </div>
    <div class="timer-pill">
      <div class="countdown-box">
        <span id="timerLabel" style="color:var(--subtext);">Kế tiếp:</span>
        <span class="countdown" id="timer">--:--</span>
      </div>
      <span class="badge badge-gray" id="channelSummary">...</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill" id="progressBar"></div>
    </div>
    <div class="meta-sub">
      <span id="lastUpdatedLabel">Cập nhật: --:--:--</span>
      <span>Chu kỳ: :00, :15, :30, :45</span>
    </div>
  </header>

  <div class="add-channel-box" id="addChannelBox">
    <div style="font-size:0.75rem; font-weight:bold; color:var(--text-bright);">Thêm kênh mới và quét ngay:</div>
    <div class="input-group">
      <input type="text" id="channelInput" class="input-box" placeholder="Dán Channel ID (UC...)">
      <button class="btn-action" id="btnAdd" onclick="submitNewChannel()">Thêm & Quét</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="controls-wrapper">
    <div class="controls">
      <button class="btn-tab active" onclick="changeSort('60m')">⏱ 60P</button>
      <button class="btn-tab" onclick="changeSort('30m')">⚡ 30P</button>
      <button class="btn-tab" onclick="changeSort('24h')">24H</button>
      <button class="btn-tab" onclick="changeSort('48h')">48H</button>
      <button class="btn-tab" onclick="changeSort('d_7')">📅 7N</button>
      <button class="btn-tab" onclick="changeSort('d_30')">📅 30N</button>
      <button class="btn-tab" onclick="changeSort('d_90')">📅 90N</button>
      <button class="btn-tab" onclick="changeSort('total')">Toàn bộ</button>
    </div>
    <div class="action-tools">
      <button class="btn-icon-toggle" id="btnEyeToggle" onclick="togglePrivacyMode()" title="Ẩn/Hiện tên kênh">👁</button>
      <button class="btn-icon-toggle" id="btnFoldToggle" onclick="toggleAllCards()" title="Thu gọn / Mở rộng toàn bộ">▲</button>
    </div>
  </div>

  <div id="appContainer">Đang tải dữ liệu...</div>

  <script>
    const REPO_OWNER = 'quanghieu2608';
    const REPO_NAME = 'youtube-views-tracker';
    const WORKFLOW_ID = 'track.yml';
    const TOTAL_CYCLE_SECONDS = 15 * 60;

    let db = null;
    let sortMode = '60m';
    let isFetching = false;
    let pollInterval = null;
    let isAllFolded = false;
    let syncStartTs = null;
    let isWaitingForNewData = false;
    let isFinishingAnimation = false;

    const channelVideoTabState = {};
    const previousValues = {};

    function getStoredToken() {
      let token = localStorage.getItem('gh_token');
      if (!token) {
        token = prompt("Vui lòng dán GitHub Personal Access Token (ghp_...):");
        if (token) localStorage.setItem('gh_token', token.trim());
      }
      return token;
    }

    function animateValue(elementId, start, end, prefix = '+', duration = 1200) {
      const el = document.getElementById(elementId);
      if (!el) return;

      if (start === end) {
        el.innerText = `${prefix}${Number(end).toLocaleString()}`;
        return;
      }

      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const current = Math.floor(start + (end - start) * easeOut);
        el.innerText = `${prefix}${current.toLocaleString()}`;
        if (progress < 1) {
          window.requestAnimationFrame(step);
        } else {
          el.innerText = `${prefix}${Number(end).toLocaleString()}`;
        }
      };
      window.requestAnimationFrame(step);
    }

    /* ĐÃ SỬA: Giữ nguyên duy nhất icon mắt 👁, không thêm dấu chéo hay đổi màu đỏ */
    function togglePrivacyMode() {
      const isPrivacy = document.body.classList.toggle('privacy-mode');
      const btn = document.getElementById('btnEyeToggle');
      if (isPrivacy) {
        btn.classList.add('eye-active');
        localStorage.setItem('privacy_mode', 'true');
      } else {
        btn.classList.remove('eye-active');
        localStorage.removeItem('privacy_mode');
      }
    }

    function initPrivacyMode() {
      if (localStorage.getItem('privacy_mode') === 'true') {
        document.body.classList.add('privacy-mode');
        const btn = document.getElementById('btnEyeToggle');
        if (btn) btn.classList.add('eye-active');
      }
    }

    function toggleAllCards() {
      isAllFolded = !isAllFolded;
      const btn = document.getElementById('btnFoldToggle');
      btn.innerText = isAllFolded ? '▼' : '▲';

      if (!db || !db.channels) return;
      const collapsedMap = {};

      Object.keys(db.channels).forEach(chId => {
        const card = document.getElementById(`card-${chId}`);
        if (card) {
          if (isAllFolded) {
            card.classList.add('is-collapsed');
            collapsedMap[chId] = true;
          } else {
            card.classList.remove('is-collapsed');
          }
        }
      });
      localStorage.setItem('collapsed_channels', JSON.stringify(collapsedMap));
    }

    async function triggerRunWorkflow() {
      const btn = document.getElementById('btnTriggerScan');
      const timerLabel = document.getElementById('timerLabel');
      const token = getStoredToken();
      if (!token) return;

      btn.disabled = true;
      btn.innerText = "⏳ Đang chạy...";
      timerLabel.innerText = "⏳ Đang quét Actions...";

      try {
        const triggerUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`;
        const res = await fetch(triggerUrl, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ ref: 'main' })
        });

        if (!res.ok) throw new Error("Lỗi Token hoặc quyền hạn Workflow!");

        let tries = 0;
        const scanPoll = setInterval(async () => {
          tries++;
          const hasNew = await checkAndApplyNewData();
          if (hasNew || tries > 15) {
            clearInterval(scanPoll);
            btn.disabled = false;
            btn.innerText = "⚡ Quét Ngay";
          }
        }, 3000);
      } catch (err) {
        alert("Lỗi kích hoạt: " + err.message);
        btn.disabled = false;
        btn.innerText = "⚡ Quét Ngay";
        timerLabel.innerText = "Kế tiếp:";
      }
    }

    function getCollapsedChannels() {
      try {
        return JSON.parse(localStorage.getItem('collapsed_channels') || '{}');
      } catch (e) {
        return {};
      }
    }

    function toggleCollapse(chId, event) {
      if (event) event.stopPropagation();
      const card = document.getElementById(`card-${chId}`);
      if (!card) return;

      const collapsedMap = getCollapsedChannels();
      const isNowCollapsed = !card.classList.contains('is-collapsed');

      if (isNowCollapsed) {
        card.classList.add('is-collapsed');
        collapsedMap[chId] = true;
      } else {
        card.classList.remove('is-collapsed');
        delete collapsedMap[chId];
      }
      localStorage.setItem('collapsed_channels', JSON.stringify(collapsedMap));
    }

    function toggleAddBox() {
      document.getElementById('addChannelBox').classList.toggle('active');
    }

    async function submitNewChannel() {
      const input = document.getElementById('channelInput');
      const msg = document.getElementById('statusMsg');
      const btn = document.getElementById('btnAdd');
      const rawVal = input.value.trim();

      if (!rawVal) {
        msg.innerHTML = '<span style="color:var(--danger)">Vui lòng nhập ID kênh!</span>';
        return;
      }

      let chId = rawVal;
      if (rawVal.includes('/channel/')) {
        chId = rawVal.split('/channel/')[1].split('/')[0].split('?')[0];
      }

      const token = getStoredToken();
      if (!token) return;

      btn.disabled = true;
      msg.innerHTML = '<span style="color:var(--primary)">1/2. Đang ghi file channels.txt...</span>';

      try {
        const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/channels.txt`;
        const res = await fetch(getUrl, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error("Sai Token hoặc không có quyền ghi repository!");
        const data = await res.json();
        const currentContent = decodeURIComponent(escape(atob(data.content)));

        if (!currentContent.includes(chId)) {
          const updatedContent = currentContent.trim() + '\n' + chId + '\n';
          await fetch(getUrl, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: `Add ${chId} via App`,
              content: btoa(unescape(encodeURIComponent(updatedContent))),
              sha: data.sha
            })
          });
        }

        msg.innerHTML = '<span style="color:var(--accent)">2/2. Đang kích hoạt Action track.yml...</span>';
        const triggerUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`;
        await fetch(triggerUrl, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ ref: 'main' })
        });

        msg.innerHTML = '<span style="color:var(--accent)">✅ Đã thêm! Trang tự làm mới sau 20s...</span>';
        input.value = '';
        setTimeout(() => { checkAndApplyNewData(); toggleAddBox(); msg.innerHTML = ''; }, 20000);
      } catch (err) {
        msg.innerHTML = `<span style="color:var(--danger)">Lỗi: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteChannel(chId, chTitle) {
      const confirmDel = confirm(`Bạn có chắc muốn XÓA kênh "${chTitle}"?`);
      if (!confirmDel) return;

      const token = getStoredToken();
      if (!token) return;

      const cardEl = document.getElementById(`card-${chId}`);
      if (cardEl) cardEl.style.opacity = '0.3';

      try {
        const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/channels.txt`;
        const res = await fetch(getUrl, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error("Không thể đọc file channels.txt từ GitHub!");
        const data = await res.json();
        const currentContent = decodeURIComponent(escape(atob(data.content)));

        const lines = currentContent.split('\n').map(l => l.trim()).filter(l => l && l !== chId);
        const updatedContent = lines.join('\n') + '\n';

        await fetch(getUrl, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: `Remove ${chId} via App`,
            content: btoa(unescape(encodeURIComponent(updatedContent))),
            sha: data.sha
          })
        });

        const triggerUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`;
        await fetch(triggerUrl, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ ref: 'main' })
        });

        if (db && db.channels && db.channels[chId]) {
          delete db.channels[chId];
          render();
        }
        alert(`Đã xóa thành công kênh "${chTitle}"!`);
      } catch (err) {
        alert("Lỗi khi xóa: " + err.message);
        if (cardEl) cardEl.style.opacity = '1';
      }
    }

    async function checkAndApplyNewData() {
      try {
        const res = await fetch('data.json?t=' + Date.now());
        const newData = await res.json();

        if (!db) {
          db = newData;
          render();
          if (db.updated_at) {
            document.getElementById('lastUpdatedLabel').innerText = `Cập nhật: ${new Date(db.updated_at).toLocaleTimeString()}`;
          }
          return true;
        }

        if (db.updated_at !== newData.updated_at) {
          isFinishingAnimation = true;
          const progressBar = document.getElementById('progressBar');
          const liveDot = document.getElementById('liveDot');

          if (liveDot) liveDot.className = "live-dot flash-white";
          if (progressBar) {
            progressBar.classList.add('rush-to-finish');
            progressBar.style.width = "100%";
          }

          setTimeout(() => {
            db = newData;
            render();

            if (db.updated_at) {
              document.getElementById('lastUpdatedLabel').innerText = `Cập nhật: ${new Date(db.updated_at).toLocaleTimeString()}`;
            }

            setTimeout(() => {
              if (liveDot) liveDot.className = "live-dot";
              if (progressBar) {
                progressBar.className = "progress-fill";
                progressBar.style.width = "100%";
              }
              isWaitingForNewData = false;
              syncStartTs = null;
              isFinishingAnimation = false;
              document.getElementById('timerLabel').innerText = "Kế tiếp:";
            }, 600);
          }, 450);

          return true;
        }
        return false;
      } catch (e) {
        return false;
      }
    }

    setInterval(() => {
      if (!db || !db.updated_at || isFinishingAnimation) return;

      const lastUpdatedMs = new Date(db.updated_at).getTime();
      const nextCronMs = lastUpdatedMs + (TOTAL_CYCLE_SECONDS * 1000);
      const nowMs = Date.now();
      const diffSecs = Math.floor((nextCronMs - nowMs) / 1000);

      const timerEl = document.getElementById('timer');
      const timerLabel = document.getElementById('timerLabel');
      const progressBar = document.getElementById('progressBar');
      const liveDot = document.getElementById('liveDot');

      if (diffSecs <= 0) {
        isWaitingForNewData = true;
        if (!syncStartTs) syncStartTs = Date.now();

        timerLabel.innerText = "Đang đồng bộ view...";
        timerEl.innerText = "";

        if (liveDot && !liveDot.classList.contains('flash-white')) {
          liveDot.className = "live-dot syncing";
        }

        if (progressBar && !progressBar.classList.contains('rush-to-finish')) {
          progressBar.classList.add('syncing-mode');
          const elapsed = (Date.now() - syncStartTs) / 1000;
          let pct = (elapsed / 35) * 80;
          if (pct > 80) pct = 80;
          progressBar.style.width = pct + "%";
        }

        if (!pollInterval && !isFetching) {
          isFetching = true;
          checkAndApplyNewData().then(success => {
            isFetching = false;
            if (success && pollInterval) {
              clearInterval(pollInterval);
              pollInterval = null;
            }
          });

          pollInterval = setInterval(async () => {
            if (isFetching) return;
            isFetching = true;
            const hasNew = await checkAndApplyNewData();
            isFetching = false;

            if (hasNew && pollInterval) {
              clearInterval(pollInterval);
              pollInterval = null;
            }
          }, 2500);
        }
      } else {
        isWaitingForNewData = false;
        syncStartTs = null;

        if (pollInterval) {
          clearInterval(pollInterval);
          pollInterval = null;
        }

        if (liveDot) liveDot.className = "live-dot";
        if (progressBar) progressBar.className = "progress-fill";

        const mins = String(Math.floor(diffSecs / 60)).padStart(2, '0');
        const secs = String(diffSecs % 60).padStart(2, '0');
        timerLabel.innerText = "Kế tiếp:";
        timerEl.innerText = `${mins}m ${secs}s`;

        if (progressBar) {
          const pct = Math.max(0, Math.min(100, (diffSecs / TOTAL_CYCLE_SECONDS) * 100));
          progressBar.style.width = pct + "%";
        }
      }
    }, 1000);

    function changeSort(mode) {
      sortMode = mode;
      document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function render() {
      if (!db || !db.channels) return;
      const chList = Object.values(db.channels);
      document.getElementById('channelSummary').innerText = `${chList.length} Kênh`;

      chList.sort((a, b) => {
        if (sortMode === '60m') return (b.v_60m || 0) - (a.v_60m || 0);
        if (sortMode === '30m') return (b.v_30m || 0) - (a.v_30m || 0);
        if (sortMode === '24h') return (b.v_24h || 0) - (a.v_24h || 0);
        if (sortMode === '48h') return (b.v_48h || 0) - (a.v_48h || 0);
        if (sortMode === 'd_7') return (b.v_7d || 0) - (a.v_7d || 0);
        if (sortMode === 'd_30') return (b.v_30d || 0) - (a.v_30d || 0);
        if (sortMode === 'd_90') return (b.v_90d || 0) - (a.v_90d || 0);
        return (b.total_channel_views || b.views || 0) - (a.total_channel_views || a.views || 0);
      });

      const container = document.getElementById('appContainer');
      container.innerHTML = '';
      const collapsedMap = getCollapsedChannels();

      chList.forEach((ch, idx) => {
        const isCollapsed = !!collapsedMap[ch.id];

        // Dữ liệu luồng 1
        const v_48h_pool = ch.v_48h_recent !== undefined ? ch.v_48h_recent : (ch.v_48h || 0);
        const [c1, c2, c3, c4] = ch.slices_15m || [0, 0, 0, 0];
        const v_total_60 = ch.v_60m !== undefined ? ch.v_60m : (c1 + c2 + c3 + c4);

        // 4 cột mini 15P
        const maxVal4 = Math.max(c1, c2, c3, c4, 1);
        const h1 = Math.max(8, Math.round((c1 / maxVal4) * 100));
        const h2 = Math.max(8, Math.round((c2 / maxVal4) * 100));
        const h3 = Math.max(8, Math.round((c3 / maxVal4) * 100));
        const h4 = Math.max(8, Math.round((c4 / maxVal4) * 100));
        const c4Color = c4 >= c3 ? 'var(--accent)' : 'var(--warning)';

        // 48 cột 1 giờ (trải dài ô 48H)
        let s48 = ch.slices_48h || [];
        if (!s48.length) s48 = new Array(48).fill(0);
        const maxVal48 = Math.max(...s48, 1);
        const bars48Html = s48.map((val, i) => {
          const barH = Math.max(6, Math.round((val / maxVal48) * 100));
          return `
            <div class="bar-col-48" title="${48 - i} giờ trước: +${val.toLocaleString()} views">
              <div class="bar-fill-48" style="height: ${barH}%;"></div>
            </div>
          `;
        }).join('');

        // Dữ liệu luồng 2 (Full Catalog)
        const v_24h_catalog = ch.v_24h || 0;
        const v_48h_catalog = ch.v_48h || 0;

        // Dữ liệu luồng 3 (Tổng kênh)
        const d7 = ch.v_7d;
        const d30 = ch.v_30d;
        const d90 = ch.v_90d;

        const activeVTab = channelVideoTabState[ch.id] || 'latest';

        const card = document.createElement('div');
        card.className = `card ${isCollapsed ? 'is-collapsed' : ''}`;
        card.id = `card-${ch.id}`;
        card.innerHTML = `
          <div class="card-top" onclick="toggleCollapse('${ch.id}', event)">
            <div class="ch-title-wrap">
              <span class="toggle-icon">▼</span>
              <div class="ch-title">
                #${idx + 1}. <span class="ch-title-text">${ch.title || 'Kênh'}</span>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
              ${ch.is_spike ? `<span class="badge badge-spike">🔥 CẮN ĐỀ XUẤT</span>` : ''}
              ${ch.has_revived_anomaly ? `<span class="badge badge-revived" title="Lệch view 24h: +${(ch.anomaly_diff_24h || 0).toLocaleString()}">⚡ CÓ VIDEO CŨ NỔ</span>` : ''}
              <span style="font-size:0.68rem; color:var(--primary);" onclick="event.stopPropagation(); toggleDrawer('${ch.id}')">Chi tiết ▾</span>
            </div>
          </div>

          <div class="badges-row">
            <span class="badge badge-gray">${(ch.subs || 0).toLocaleString()} Subs</span>
            <span class="badge badge-gray">${ch.videos_count || 0} Vid</span>
            <span class="badge badge-gray">Pool: 100 Vid mới</span>
          </div>

          <div class="card-body">
            <!-- LUỒNG 1: 100 VIDEO MỚI -->
            <div class="stream-header">
              <span>⚡ Luồng 1 (Top 100 Vid Mới - Realtime)</span>
            </div>
            <div class="stream1-grid">
              <div class="box-stream1">
                <div class="box-header-metric">
                  <span class="metric-label">🔥 48H</span>
                  <span class="metric-val-main" id="val-48h-pool-${ch.id}" style="color:var(--primary);">+0</span>
                </div>
                <div class="bars-container-48">
                  ${bars48Html}
                </div>
              </div>

              <div class="box-stream1">
                <div class="box-header-metric">
                  <span class="metric-label">⏱ 60P</span>
                  <span class="metric-val-main" id="val-60p-${ch.id}" style="color:var(--accent);">+0</span>
                </div>
                <div class="bars-container-4">
                  <div class="bar-col-4">
                    <div class="bar-track-4">
                      <div class="bar-fill-4" style="height: ${h1}%; background: #265999;"></div>
                    </div>
                    <span class="bar-val-4" id="val-c1-${ch.id}" style="color: #58a6ff;">+0</span>
                  </div>
                  <div class="bar-col-4">
                    <div class="bar-track-4">
                      <div class="bar-fill-4" style="height: ${h2}%; background: #388bfd;"></div>
                    </div>
                    <span class="bar-val-4" id="val-c2-${ch.id}" style="color: #58a6ff;">+0</span>
                  </div>
                  <div class="bar-col-4">
                    <div class="bar-track-4">
                      <div class="bar-fill-4" style="height: ${h3}%; background: #388bfd;"></div>
                    </div>
                    <span class="bar-val-4" id="val-c3-${ch.id}" style="color: #58a6ff;">+0</span>
                  </div>
                  <div class="bar-col-4">
                    <div class="bar-track-4">
                      <div class="bar-fill-4" style="height: ${h4}%; background: ${c4Color};"></div>
                    </div>
                    <span class="bar-val-4" id="val-c4-${ch.id}" style="color: ${c4Color};">+0</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- LUỒNG 2: FULL CATALOG SCAN -->
            <div class="stream-header" style="margin-top:10px;">
              <span>📦 Luồng 2 (Full Catalog Scan - Định Kỳ 24H)</span>
            </div>
            <div class="stream2-grid">
              <div class="stat-box-catalog">
                <div class="stat-label-catalog">24H Toàn Kênh</div>
                <div class="stat-val-catalog" id="val-24h-cat-${ch.id}">+0</div>
              </div>
              <div class="stat-box-catalog">
                <div class="stat-label-catalog">48H Toàn Kênh</div>
                <div class="stat-val-catalog" id="val-48h-cat-${ch.id}">+0</div>
              </div>
            </div>

            <!-- LUỒNG 3: DÀI HẠN & TỔNG TOÀN KÊNH -->
            <div class="longterm-strip">
              <div class="lt-item">
                <span class="lt-label">7N</span>
                <span class="lt-val">${d7 !== undefined && d7 !== null ? '+' + d7.toLocaleString() : '+ -'}</span>
              </div>
              <div class="lt-item">
                <span class="lt-label">30N</span>
                <span class="lt-val">${d30 !== undefined && d30 !== null ? '+' + d30.toLocaleString() : '+ -'}</span>
              </div>
              <div class="lt-item">
                <span class="lt-label">90N (3T)</span>
                <span class="lt-val">${d90 !== undefined && d90 !== null ? '+' + d90.toLocaleString() : '+ -'}</span>
              </div>
              <div class="lt-item">
                <span class="lt-label">TỔNG KÊNH</span>
                <span class="lt-val">${(ch.total_channel_views || ch.views || 0).toLocaleString()}</span>
              </div>
            </div>
          </div>

          <!-- Drawer Chi Tiết Video -->
          <div class="video-drawer" id="box-${ch.id}">
            <div class="drawer-header-row">
              <div class="v-tabs-group">
                <button class="btn-v-tab ${activeVTab === 'latest' ? 'active' : ''}" onclick="switchVideoTab('${ch.id}', 'latest')">🕒 Mới nhất</button>
                <button class="btn-v-tab ${activeVTab === '60m' ? 'active' : ''}" onclick="switchVideoTab('${ch.id}', '60m')">⏱ Top 60P</button>
                <button class="btn-v-tab ${activeVTab === '48h' ? 'active' : ''}" onclick="switchVideoTab('${ch.id}', '48h')">🔥 Top 48H</button>
                <button class="btn-v-tab tab-orange ${activeVTab === 'revived' ? 'active' : ''}" onclick="switchVideoTab('${ch.id}', 'revived')">
                  ⚡ Nổi lại (${(ch.revived_videos || []).length})
                </button>
              </div>
              <button class="btn-delete-channel" onclick="deleteChannel('${ch.id}', '${ch.title ? ch.title.replace(/'/g, "\\'") : 'Kênh'}')">🗑 Xóa kênh này</button>
            </div>
            <div class="v-scroll-area" id="v-list-${ch.id}">
              ${renderVideos(ch, activeVTab)}
            </div>
          </div>
        `;
        container.appendChild(card);

        const old48hPool = previousValues[`48h-pool-${ch.id}`] || 0;
        const old60p = previousValues[`60p-${ch.id}`] || 0;
        const oldC1 = previousValues[`c1-${ch.id}`] || 0;
        const oldC2 = previousValues[`c2-${ch.id}`] || 0;
        const oldC3 = previousValues[`c3-${ch.id}`] || 0;
        const oldC4 = previousValues[`c4-${ch.id}`] || 0;
        const old24hCat = previousValues[`24h-cat-${ch.id}`] || 0;
        const old48hCat = previousValues[`48h-cat-${ch.id}`] || 0;

        animateValue(`val-48h-pool-${ch.id}`, old48hPool, v_48h_pool);
        animateValue(`val-60p-${ch.id}`, old60p, v_total_60);
        animateValue(`val-c1-${ch.id}`, oldC1, c1);
        animateValue(`val-c2-${ch.id}`, oldC2, c2);
        animateValue(`val-c3-${ch.id}`, oldC3, c3);
        animateValue(`val-c4-${ch.id}`, oldC4, c4);
        animateValue(`val-24h-cat-${ch.id}`, old24hCat, v_24h_catalog);
        animateValue(`val-48h-cat-${ch.id}`, old48hCat, v_48h_catalog);

        previousValues[`48h-pool-${ch.id}`] = v_48h_pool;
        previousValues[`60p-${ch.id}`] = v_total_60;
        previousValues[`c1-${ch.id}`] = c1;
        previousValues[`c2-${ch.id}`] = c2;
        previousValues[`c3-${ch.id}`] = c3;
        previousValues[`c4-${ch.id}`] = c4;
        previousValues[`24h-cat-${ch.id}`] = v_24h_catalog;
        previousValues[`48h-cat-${ch.id}`] = v_48h_catalog;
      });
    }

    function switchVideoTab(chId, tab) {
      channelVideoTabState[chId] = tab;
      const drawer = document.getElementById(`box-${chId}`);
      if (!drawer || !db || !db.channels[chId]) return;

      drawer.querySelectorAll('.btn-v-tab').forEach(b => b.classList.remove('active'));
      const activeBtn = drawer.querySelector(`button[onclick*="'${tab}'"]`);
      if (activeBtn) activeBtn.classList.add('active');

      const vContainer = document.getElementById(`v-list-${chId}`);
      if (vContainer) {
        vContainer.innerHTML = renderVideos(db.channels[chId], tab);
      }
    }

    function renderVideos(ch, tab = 'latest') {
      if (tab === 'revived') {
        const revList = ch.revived_videos || [];
        if (!revList.length) {
          return '<div style="font-size:0.7rem; color:var(--subtext); padding:10px 0; text-align:center;">Chưa phát hiện video cũ nào tăng đột biến. Dữ liệu đối soát lúc 07:00 sáng.</div>';
        }
        return revList.slice(0, 20).map((v, i) => `
          <div class="v-item">
            <div class="v-title-row">
              <a class="v-title" href="https://youtu.be/${v.id}" target="_blank">#${i+1}. ${v.title}</a>
            </div>
            <div class="v-metrics">
              <span style="color:var(--subtext);">Tổng: ${(v.views || 0).toLocaleString()}</span>
              <div class="v-growth" style="color:var(--orange);">+${(v.v_delta_24h || 0).toLocaleString()} <span style="font-size:0.6rem; color:var(--subtext); font-weight:normal;">(24H)</span></div>
            </div>
          </div>
        `).join('');
      }

      const videos = ch.videos;
      if (!videos || !videos.length) return '<div style="font-size:0.7rem; color:var(--subtext); padding:6px 0;">Chưa có video</div>';

      const vCopy = [...videos];

      if (tab === 'latest') {
        vCopy.sort((a, b) => new Date(b.published_at || 0) - new Date(a.published_at || 0));
      } else if (tab === '60m') {
        vCopy.sort((a, b) => (b.v_60m || 0) - (a.v_60m || 0) || (new Date(b.published_at || 0) - new Date(a.published_at || 0)));
      } else if (tab === '48h') {
        vCopy.sort((a, b) => (b.v_48h || 0) - (a.v_48h || 0) || (new Date(b.published_at || 0) - new Date(a.published_at || 0)));
      }

      return vCopy.slice(0, 20).map((v, i) => {
        let badgeInfo = '';
        if (tab === 'latest') {
          badgeInfo = `
            <span style="color:var(--subtext);">Xuất bản: ${v.published_at ? v.published_at.slice(0,10) : ''}</span>
            <div class="v-growth" style="color:var(--text-bright);">👁 ${(v.views || 0).toLocaleString()}</div>
          `;
        } else if (tab === '60m') {
          badgeInfo = `
            <span style="color:var(--subtext);">Tổng: ${(v.views || 0).toLocaleString()}</span>
            <div class="v-growth" style="color:var(--accent);">+${(v.v_60m || 0).toLocaleString()} <span style="font-size:0.6rem; color:var(--subtext); font-weight:normal;">(60P)</span></div>
          `;
        } else if (tab === '48h') {
          badgeInfo = `
            <span style="color:var(--subtext);">Tổng: ${(v.views || 0).toLocaleString()}</span>
            <div class="v-growth" style="color:var(--primary);">+${(v.v_48h || 0).toLocaleString()} <span style="font-size:0.6rem; color:var(--subtext); font-weight:normal;">(48H)</span></div>
          `;
        }

        return `
          <div class="v-item">
            <div class="v-title-row">
              <a class="v-title" href="https://youtu.be/${v.id}" target="_blank">#${i+1}. ${v.title}</a>
            </div>
            <div class="v-metrics">
              ${badgeInfo}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleDrawer(id) {
      const el = document.getElementById('box-' + id);
      if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    initPrivacyMode();
    checkAndApplyNewData();
  </script>
</body>
</html>
