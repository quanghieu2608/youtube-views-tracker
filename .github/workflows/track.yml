name: YouTube Views Tracker

on:
  schedule:
    # Chạy tự động định kỳ mỗi 15 phút (:00, :15, :30, :45)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Giới hạn chỉ cho phép đúng 1 job chạy tại 1 thời điểm trên nhánh main (chống đè commit)
concurrency:
  group: tracker-sync
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client

      - name: Run Tracker Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python run.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Kiểm tra nếu data.json có thay đổi
          if ! git diff --quiet data.json; then
            git add data.json
            git commit -m "Auto update views 15m [skip ci]"

            # Vòng lặp thử lại tối đa 5 lần nếu gặp xung đột lock ref
            success=false
            for i in {1..5}; do
              echo "Dang dong bo va push commit (lan $i/5)..."
              git fetch origin main
              if git rebase origin/main; then
                if git push origin main; then
                  echo "Push thanh cong!"
                  success=true
                  break
                fi
              else
                git rebase --abort
              fi
              sleep 2
            done

            if [ "$success" = false ]; then
              echo "Khong the push sau 5 lan thu."
              exit 1
            fi
          else
            echo "Khong co thay doi nao trong data.json."
          fi
